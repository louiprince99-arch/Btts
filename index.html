<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chirish and GLS BTTS Picks</title>
<style>
  :root{
    --black:#000;
    --tt-white:#f2f2f2;
    --tt-yellow:#f4c927;
    --tt-green:#2fd15c;
    --tt-cyan:#3ecbe0;
    --tt-red:#e0473e;
    --tt-grey:#7a7a7a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--black);
    color:var(--tt-white);
    font-family:ui-monospace,"SF Mono","Courier New",monospace;
    padding:0.5rem;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  header{
    background:var(--tt-yellow);
    color:var(--black);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0.35rem 0.6rem;
    flex-shrink:0;
    font-weight:700;
  }
  header .title{
    font-size:0.7rem;
    letter-spacing:0.02em;
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  header .page-num{
    font-size:0.7rem;
    font-weight:400;
    opacity:0.75;
  }
  button.refresh{
    background:var(--black);
    color:var(--tt-yellow);
    border:none;
    padding:0.25rem 0.5rem;
    font-family:inherit;
    font-size:0.68rem;
    font-weight:700;
    cursor:pointer;
  }
  button.refresh:disabled{ opacity:0.5; }

  .banner{
    background:var(--tt-red);
    color:var(--black);
    font-size:0.65rem;
    font-weight:700;
    padding:0.3rem 0.6rem;
    display:none;
    flex-shrink:0;
  }

  main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
  }
  section.slate{
    display:flex;
    flex-direction:column;
    min-height:0;
    padding:0.4rem 0.5rem;
  }
  section.slate:first-child{
    border-right:1px dashed #333;
  }
  section.slate h2{
    color:var(--tt-green);
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.04em;
    margin:0;
  }
  section.slate .updated{
    color:var(--tt-grey);
    font-size:0.6rem;
    margin-bottom:0.3rem;
  }

  ol.picks{
    list-style:none;
    margin:0;
    padding:0;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:0;
  }
  ol.picks li.pick{
    line-height:1.2;
    border-top:1px solid #1a1a1a;
    padding:0.22rem 0;
  }
  ol.picks li.pick:first-child{ border-top:none; }

  .row1{
    display:flex;
    align-items:baseline;
    gap:0.3rem;
  }
  .rank{
    color:var(--tt-yellow);
    font-weight:700;
    font-size:0.68rem;
    width:0.85rem;
    flex-shrink:0;
  }
  .teams{
    flex:1;
    min-width:0;
    color:var(--tt-white);
    font-size:0.68rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .prob{
    color:var(--tt-yellow);
    font-weight:700;
    font-size:0.72rem;
    flex-shrink:0;
  }
  .row2{
    color:var(--tt-cyan);
    font-size:0.58rem;
    padding-left:1.15rem;
  }
  .row2 .lg{ color:var(--tt-grey); }

  .empty{ color:var(--tt-grey); font-size:0.68rem; padding:0.4rem 0; }
  .note{ color:var(--tt-grey); font-size:0.55rem; padding-top:0.2rem; }

  @keyframes flicker{ 0%,100%{opacity:0.3;} 50%{opacity:0.7;} }
  .skeleton{
    height:0.6rem;
    background:#1a1a1a;
    animation:flicker 1.2s ease-in-out infinite;
    margin:0.35rem 0;
  }
</style>
</head>
<body>
<header>
  <span class="title">CHIRISH AND GLS BTTS PICKS</span>
  <span class="page-num">p690</span>
  <button class="refresh" id="refresh-btn" onclick="loadPicks()">GENERATE PICKS</button>
</header>

<div class="banner" id="coverage-banner"></div>

<main>
  <section class="slate">
    <h2>MIDWEEK</h2>
    <div class="updated" id="midweek-updated">—</div>
    <ol class="picks" id="midweek-list">
      <li class="empty">TAP GENERATE PICKS</li>
    </ol>
  </section>

  <section class="slate">
    <h2>SATURDAY</h2>
    <div class="updated" id="saturday-updated">—</div>
    <ol class="picks" id="saturday-list">
      <li class="empty">TAP GENERATE PICKS</li>
    </ol>
  </section>
</main>

<script>
function fmtKickoff(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-GB', { timeZone:'Europe/London', weekday:'short', hour:'2-digit', minute:'2-digit' });
}
function fmtGenerated(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-GB', { timeZone:'Europe/London', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
function leagueLabel(key){
  return { championship:'Championship', league_one:'League One', league_two:'League Two' }[key] || key;
}
function leagueShort(key){
  return { championship:'CHA', league_one:'L1', league_two:'L2' }[key] || key;
}

function renderSlate(listEl, updatedEl, data, loadFailed){
  if(loadFailed){
    listEl.innerHTML = '<li class="empty">LOAD FAILED — TAP REFRESH</li>';
    updatedEl.textContent = '—';
    return;
  }
  if(!data || !data.picks || !data.picks.length){
    listEl.innerHTML = '<li class="empty">NO FIXTURES IN THIS WINDOW</li>';
    updatedEl.textContent = 'checked ' + fmtGenerated(data ? data.generatedAt : new Date().toISOString());
    return;
  }

  updatedEl.textContent = 'updated ' + fmtGenerated(data.generatedAt);

  listEl.innerHTML = data.picks.map((p, i) => {
    const pct = Math.round(p.bttsProbability * 100);
    return `
    <li class="pick">
      <div class="row1">
        <span class="rank">${i+1}</span>
        <span class="teams">${p.home} v ${p.away}</span>
        <span class="prob">${pct}%</span>
      </div>
      <div class="row2"><span class="lg">${leagueShort(p.league)}</span> ${fmtKickoff(p.kickoff)}</div>
    </li>`;
  }).join('');
}

function renderCoverageBanner(results){
  const allErrors = [];
  results.forEach(r => {
    if (r.status === 'fulfilled' && r.value && r.value.leagueErrors) {
      r.value.leagueErrors.forEach(e => allErrors.push(e.league));
    }
  });
  const uniqueLeagues = [...new Set(allErrors)];
  const banner = document.getElementById('coverage-banner');
  if (uniqueLeagues.length) {
    banner.style.display = 'block';
    banner.textContent = `${uniqueLeagues.map(leagueShort).join('/')} NOT PUBLISHED YET — CHAMPIONSHIP ONLY`;
  } else {
    banner.style.display = 'none';
  }
}

function loadPicks(){
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '...';

  Promise.allSettled([
    fetch('/api/picks?slate=midweek').then(r => r.json()),
    fetch('/api/picks?slate=saturday').then(r => r.json()),
  ]).then(([midweek, saturday]) => {
    renderSlate(
      document.getElementById('midweek-list'),
      document.getElementById('midweek-updated'),
      midweek.status === 'fulfilled' ? midweek.value : null,
      midweek.status !== 'fulfilled'
    );
    renderSlate(
      document.getElementById('saturday-list'),
      document.getElementById('saturday-updated'),
      saturday.status === 'fulfilled' ? saturday.value : null,
      saturday.status !== 'fulfilled'
    );
    renderCoverageBanner([midweek, saturday]);
  }).finally(() => {
    btn.disabled = false;
    btn.textContent = 'GENERATE PICKS';
  });
}

// picks are generated on demand — tap the button, nothing loads automatically
</script>
</body>
</html>
